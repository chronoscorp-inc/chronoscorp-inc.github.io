<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronos Corp — Your life, optimized.</title>
<meta name="description" content="Human biology delivers reality minutes late. You live in a rerun. Our mission at Chronos Corp is to turn this biological flaw into optimization.">
<link rel="preconnect" href="https://googleapis.com">
<link href="https://googleapis.com/css2?family=Syne+Mono&family=Syne:wght@400;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#020508;--bg2:#050d12;--cyan:#00B8B8;--c2:#007878;--c3:#003838;--orange:#FF5500;--white:#F0F4F4;--gray:#5A6A6A;--lgray:#1A2A2A;--border:#0D2020;--red:#CC2200}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--white);font-family:'Syne',sans-serif;overflow-x:hidden;cursor:crosshair}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,184,184,.012) 2px,rgba(0,184,184,.012) 4px);pointer-events:none;z-index:9999}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--c2)}
  .fi{opacity:1 !important;transform:none !important}

.mono{font-family:'Syne Mono',monospace}
.container{max-width:1100px;margin:0 auto;padding:0 2rem}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;border-bottom:1px solid var(--border);background:rgba(2,5,8,.94);backdrop-filter:blur(16px)}
.nav-inner{max-width:1100px;margin:0 auto;padding:0 2rem;height:58px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-family:'Syne Mono',monospace;font-size:13px;color:var(--cyan);letter-spacing:.15em;text-decoration:none;display:flex;align-items:center;gap:10px}
.logo-ring{width:22px;height:22px;border:1.5px solid var(--cyan);border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center}
.logo-ring::before{content:'';position:absolute;width:1px;height:8px;background:var(--cyan);top:3px;transform-origin:bottom center;animation:tick 2s steps(1) infinite}
@keyframes tick{0%,100%{transform:rotate(0deg)}25%{transform:rotate(90deg)}50%{transform:rotate(180deg)}75%{transform:rotate(270deg)}}
.nav-links{display:flex;gap:2rem;list-style:none}
.nav-links a{font-family:'Syne Mono',monospace;font-size:11px;color:var(--gray);text-decoration:none;letter-spacing:.12em;text-transform:uppercase;transition:color .2s}
.nav-links a:hover{color:var(--cyan)}
.nav-status{font-family:'Syne Mono',monospace;font-size:10px;color:var(--cyan);display:flex;align-items:center;gap:6px}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:pd 2s ease infinite}
@keyframes pd{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}

/* TICKER */
.ticker{background:var(--lgray);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:9px 0;overflow:hidden;white-space:nowrap;margin-top:58px}
.ticker-track{display:inline-block;animation:tkr 30s linear infinite}
.ticker-track:hover{animation-play-state:paused}
@keyframes tkr{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ti{font-family:'Syne Mono',monospace;font-size:11px;color:var(--gray);margin:0 2.5rem;letter-spacing:.08em}
.ti .c{color:var(--cyan)}.ti .a{color:var(--orange)}

/* HERO */
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:80px 0;position:relative;overflow:hidden}
.hgrid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:60px 60px;opacity:.35}
.hglow{position:absolute;top:15%;right:-8%;width:600px;height:600px;background:radial-gradient(circle,rgba(0,184,184,.07) 0%,transparent 70%);pointer-events:none}
.hglow2{position:absolute;bottom:10%;left:-5%;width:400px;height:400px;background:radial-gradient(circle,rgba(255,85,0,.05) 0%,transparent 70%);pointer-events:none}
.hero-content{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:0 2rem}
.hlabel{font-family:'Syne Mono',monospace;font-size:11px;color:var(--cyan);letter-spacing:.25em;text-transform:uppercase;margin-bottom:2rem;display:flex;align-items:center;gap:12px}
.hlabel::before{content:'';width:40px;height:1px;background:var(--cyan)}
h1{font-family:'DM Serif Display',serif;font-size:clamp(44px,7vw,96px);line-height:1.0;font-weight:400;margin-bottom:1rem;letter-spacing:-.02em}
h1 .c{color:var(--cyan);font-style:italic}
h1 .o{color:var(--orange)}
.hsub{font-family:'Syne Mono',monospace;font-size:clamp(12px,1.3vw,14px);color:var(--gray);line-height:1.9;max-width:520px;margin-bottom:3rem}
.hsub strong{color:var(--white);font-weight:400}
.hctas{display:flex;gap:1rem;flex-wrap:wrap}
.btn{font-family:'Syne Mono',monospace;font-size:12px;letter-spacing:.15em;text-transform:uppercase;padding:13px 26px;cursor:pointer;text-decoration:none;display:inline-block;transition:all .2s;border:none}
.btn-p{color:var(--bg);background:var(--cyan);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.btn-p:hover{background:var(--white)}
.btn-o{color:var(--cyan);background:transparent;border:1px solid var(--c2)}
.btn-o:hover{border-color:var(--cyan);background:rgba(0,184,184,.06)}
.hstats{position:absolute;bottom:2.5rem;left:50%;transform:translateX(-50%);display:flex;gap:4rem;z-index:2}
.stat{text-align:center}
.sv{font-family:'Syne Mono',monospace;font-size:28px;color:var(--cyan);display:block}
.sl{font-family:'Syne Mono',monospace;font-size:10px;color:var(--gray);letter-spacing:.15em;text-transform:uppercase;margin-top:4px}

/* SECTIONS */
section{padding:90px 0}
.slabel{font-family:'Syne Mono',monospace;font-size:10px;color:var(--c2);letter-spacing:.25em;text-transform:uppercase;margin-bottom:1rem;display:flex;align-items:center;gap:10px}
.slabel::before{content:'';width:24px;height:1px;background:var(--c2)}
h2{font-family:'DM Serif Display',serif;font-size:clamp(30px,4vw,52px);line-height:1.1;margin-bottom:1.5rem;font-weight:400}
h2 em{color:var(--cyan);font-style:italic}

/* PANEL */
.panel{border:1px solid var(--border);background:var(--bg2);position:relative}
.panel::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),transparent)}
.panel-hd{font-family:'Syne Mono',monospace;font-size:10px;color:var(--cyan);letter-spacing:.2em;text-transform:uppercase;padding:1.25rem 1.5rem;border-bottom:1px solid var(--border)}
.drow{display:flex;justify-content:space-between;align-items:center;padding:.6rem 1.5rem;border-bottom:1px solid var(--border)}
.drow:last-child{border-bottom:none}
.dl{font-family:'Syne Mono',monospace;font-size:11px;color:var(--gray)}
.dv{font-family:'Syne Mono',monospace;font-size:11px;color:var(--cyan)}
.dv.ok{color:#1DB87A}.dv.al{color:var(--orange)}.dv.red{color:var(--red)}

/* MISSÃO */
.mg{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:start}
.mt p{font-family:'Syne Mono',monospace;font-size:13px;color:var(--gray);line-height:1.9;margin-bottom:1.5rem}
.mt p strong{color:var(--white);font-weight:400}

/* PRODUTOS */
.produtos{background:var(--bg2)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-top:3rem}
.pc{background:var(--bg);padding:1.75rem 1.5rem;position:relative;overflow:hidden;transition:background .3s;cursor:default}
.pc::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:0;transition:opacity .3s}
.pc:hover{background:var(--bg2)}.pc:hover::after{opacity:1}
.pn{font-family:'Syne Mono',monospace;font-size:10px;color:var(--c2);letter-spacing:.2em;margin-bottom:.75rem}
.pname{font-family:'DM Serif Display',serif;font-size:21px;color:var(--white);margin-bottom:.4rem;font-weight:400}
.ptag{font-family:'Syne Mono',monospace;font-size:10px;color:var(--orange);letter-spacing:.15em;text-transform:uppercase;margin-bottom:.75rem}
.pdesc{font-family:'Syne Mono',monospace;font-size:11px;color:var(--gray);line-height:1.7}
.pst{font-family:'Syne Mono',monospace;font-size:10px;color:var(--cyan);margin-top:1.25rem;padding-top:.75rem;border-top:1px solid var(--border);display:flex;align-items:center;gap:6px}
.pst::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}

/* ── TERMINAL ── */
#terminal-section{background:var(--bg);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:70px 0}
.terminal{border:1px solid var(--c2);background:#010305;max-width:700px;margin:2rem auto 0;position:relative}
.term-bar{background:var(--lgray);padding:.6rem 1rem;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid var(--border)}
.term-dot{width:10px;height:10px;border-radius:50%}
.term-title{font-family:'Syne Mono',monospace;font-size:11px;color:var(--gray);margin-left:auto}
.term-output{padding:1.5rem;min-height:220px;max-height:320px;overflow-y:auto;font-family:'Syne Mono',monospace;font-size:13px;line-height:1.8}
.term-output::-webkit-scrollbar{width:3px}
.term-output::-webkit-scrollbar-thumb{background:var(--c2)}
.term-line{margin-bottom:4px}
.term-line.cmd{color:var(--cyan)}
.term-line.out{color:var(--gray)}
.term-line.ok{color:#1DB87A}
.term-line.err{color:var(--red)}
.term-line.warn{color:var(--orange)}
.term-line.hi{color:var(--white)}
.term-input-row{display:flex;align-items:center;padding:.75rem 1rem;border-top:1px solid var(--border);gap:.5rem}
.term-prompt{font-family:'Syne Mono',monospace;font-size:13px;color:var(--cyan)}
.term-input{flex:1;background:transparent;border:none;outline:none;font-family:'Syne Mono',monospace;font-size:13px;color:var(--white);caret-color:var(--cyan)}
.term-hint{font-family:'Syne Mono',monospace;font-size:10px;color:var(--c2);text-align:center;margin-top:1rem}
/* ── QUIZ ── */
#quiz-section{padding:80px 0}
.quiz-box{max-width:680px;margin:2rem auto 0;border:1px solid var(--border);background:var(--bg2);position:relative}
.quiz-box::before{content:'';display:block;height:2px;background:linear-gradient(90deg,var(--cyan),var(--orange))}
.quiz-inner{padding:2rem}
.quiz-progress{font-family:'Syne Mono',monospace;font-size:10px;color:var(--c2);letter-spacing:.2em;margin-bottom:1.5rem}
.quiz-q{font-family:'DM Serif Display',serif;font-size:22px;color:var(--white);margin-bottom:1.5rem;line-height:1.4;font-weight:400}
.quiz-opts{display:flex;flex-direction:column;gap:.75rem}
.quiz-opt{font-family:'Syne Mono',monospace;font-size:12px;color:var(--gray);padding:.85rem 1.25rem;border:1px solid var(--border);background:transparent;cursor:pointer;text-align:left;transition:all .2s;display:flex;align-items:center;gap:10px}
.quiz-opt::before{content:'○';color:var(--c2);flex-shrink:0}
.quiz-opt:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(0,184,184,.05)}
.quiz-opt:hover::before{content:'●';color:var(--cyan)}
.quiz-result{display:none;padding:2rem;text-align:center}
.result-model{font-family:'DM Serif Display',serif;font-size:36px;color:var(--cyan);margin-bottom:.5rem;font-weight:400}
.result-tag{font-family:'Syne Mono',monospace;font-size:11px;color:var(--orange);letter-spacing:.2em;margin-bottom:1rem}
.result-desc{font-family:'Syne Mono',monospace;font-size:12px;color:var(--gray);line-height:1.8;margin-bottom:1.5rem}
.quiz-reset{font-family:'Syne Mono',monospace;font-size:11px;color:var(--c2);background:none;border:1px solid var(--border);padding:8px 20px;cursor:pointer;letter-spacing:.15em;text-transform:uppercase;transition:all .2s}
.quiz-reset:hover{border-color:var(--cyan);color:var(--cyan)}
/* ── ANOMALIA COUNTER ── */
.anomalia-bar{background:var(--bg);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:60px 0;text-align:center;position:relative;overflow:hidden}
.anom-bg{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,85,0,.04) 0%,transparent 70%)}
.anom-label{font-family:'Syne Mono',monospace;font-size:11px;color:var(--orange);letter-spacing:.25em;text-transform:uppercase;margin-bottom:1rem;animation:blink 1.8s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.anom-code{font-family:'Syne Mono',monospace;font-size:clamp(32px,5.5vw,72px);color:var(--orange);letter-spacing:.1em;margin-bottom:.5rem;cursor:pointer;transition:color .3s}
.anom-code:hover{color:var(--red)}
.anom-counter{font-family:'Syne Mono',monospace;font-size:13px;color:var(--gray);margin-bottom:1.5rem}
.anom-counter span{color:var(--orange)}
.anom-alerts{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:.5rem;min-height:80px}
.anom-alert{font-family:'Syne Mono',monospace;font-size:11px;padding:.5rem 1rem;border:1px solid;text-align:left;opacity:0;transform:translateY(8px);transition:all .5s}
.anom-alert.show{opacity:1;transform:translateY(0)}
.anom-alert.lvl1{color:var(--gray);border-color:var(--border)}
.anom-alert.lvl2{color:var(--orange);border-color:rgba(255,85,0,.3)}
.anom-alert.lvl3{color:var(--red);border-color:rgba(204,34,0,.5);background:rgba(204,34,0,.05)}
/* ── ARQUIVO KUMANI ── */
#arquivo-section{padding:80px 0;background:var(--bg2)}
.arquivo-box{max-width:600px;margin:2rem auto 0;border:1px solid var(--border);background:var(--bg);position:relative}
.arquivo-box::before{content:'';display:block;height:2px;background:linear-gradient(90deg,var(--orange),transparent)}
.arq-locked{padding:2.5rem;text-align:center}
.arq-icon{font-size:48px;margin-bottom:1.5rem;filter:grayscale(1);opacity:.5}
.arq-title{font-family:'Syne Mono',monospace;font-size:12px;color:var(--gray);letter-spacing:.2em;text-transform:uppercase;margin-bottom:.5rem}
.arq-sub{font-family:'Syne Mono',monospace;font-size:11px;color:var(--c2);margin-bottom:2rem;line-height:1.6}
.arq-input-row{display:flex;gap:0;margin-bottom:1rem}
.arq-input{flex:1;background:var(--bg2);border:1px solid var(--border);border-right:none;color:var(--white);font-family:'Syne Mono',monospace;font-size:13px;padding:11px 14px;outline:none;letter-spacing:.1em;text-transform:uppercase}
.arq-input:focus{border-color:var(--c2)}
.arq-btn{font-family:'Syne Mono',monospace;font-size:11px;letter-spacing:.15em;background:var(--c2);color:var(--bg);border:none;padding:11px 18px;cursor:pointer;transition:background .2s;white-space:nowrap}
.arq-btn:hover{background:var(--cyan)}
.arq-msg{font-family:'Syne Mono',monospace;font-size:11px;height:20px;transition:all .3s}
.arq-msg.err{color:var(--red)}.arq-msg.ok{color:#1DB87A}
.arq-hint{font-family:'Syne Mono',monospace;font-size:10px;color:var(--border);margin-top:1.5rem;letter-spacing:.1em}
.arq-hint:hover{color:var(--c2);cursor:help}
.arq-content{display:none;padding:2rem}
.arq-content-title{font-family:'Syne Mono',monospace;font-size:10px;color:var(--cyan);letter-spacing:.2em;text-transform:uppercase;margin-bottom:1.5rem;border-bottom:1px solid var(--border);padding-bottom:.75rem}
.arq-file{padding:.75rem 0;border-bottom:1px solid var(--border);cursor:pointer}
.arq-file:last-child{border-bottom:none}
.arq-file-name{font-family:'Syne Mono',monospace;font-size:12px;color:var(--cyan);margin-bottom:3px}
.arq-file-desc{font-family:'Syne Mono',monospace;font-size:11px;color:var(--gray)}
.arq-file-data{font-family:'Syne Mono',monospace;font-size:11px;color:var(--white);margin-top:.5rem;padding:.75rem;background:var(--bg2);border-left:2px solid var(--cyan);display:none;line-height:1.8}
/* ── MAPA ── */
#mapa-section{padding:80px 0}
.mapa-container{margin-top:2rem;border:1px solid var(--border);background:var(--bg2);position:relative;overflow:hidden}
.mapa-hd{padding:1rem 1.5rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.mapa-hd-title{font-family:'Syne Mono',monospace;font-size:11px;color:var(--cyan);letter-spacing:.15em}
.mapa-hd-stat{font-family:'Syne Mono',monospace;font-size:10px;color:var(--gray)}
.mapa-canvas{display:block;width:100%;cursor:crosshair}
.mapa-legend{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;gap:2rem;flex-wrap:wrap}
.mapa-leg-item{display:flex;align-items:center;gap:6px;font-family:'Syne Mono',monospace;font-size:10px;color:var(--gray)}
.mapa-leg-dot{width:8px;height:8px;border-radius:50%}
.mapa-tooltip{position:absolute;font-family:'Syne Mono',monospace;font-size:11px;background:rgba(2,5,8,.95);border:1px solid var(--c2);padding:8px 12px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;color:var(--white)}
/* ── PERFIS DE PERSONAGENS ── */
.chars-grid-new{display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-top:3rem}
.ch-new{border:1px solid var(--border);background:var(--bg2);overflow:hidden;position:relative}
.ch-new.nia::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--cyan);z-index:2}
.ch-new.luc::before{content:'';position:absolute;top:0;right:0;bottom:0;width:3px;background:var(--orange);z-index:2}
.ch-new-body{padding:1.5rem 2rem}
.ch-new-role{font-family:'Syne Mono',monospace;font-size:10px;color:var(--gray);letter-spacing:.2em;text-transform:uppercase;margin-bottom:.4rem}
.ch-new-name{font-family:'DM Serif Display',serif;font-size:32px;font-weight:400;margin-bottom:.75rem}
.ch-new.nia .ch-new-name{color:var(--cyan)}.ch-new.luc .ch-new-name{color:var(--orange)}
.ch-new-desc{font-family:'Syne Mono',monospace;font-size:11px;color:var(--gray);line-height:1.8;margin-bottom:1rem}
.ch-new-specs{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--border);padding-top:1rem}
.ch-new-spec{display:flex;justify-content:space-between;font-family:'Syne Mono',monospace;font-size:11px;padding:.4rem 0;border-bottom:1px solid var(--border)}
.ch-new-spec:last-child{border-bottom:none}
.ch-new-sl{color:var(--gray)}.ch-new-sv{color:var(--white)}
/* ── CONTATO CORPORATIVO ── */
#contato-section{padding:80px 0;background:var(--bg)}
.contato-grid{display:grid;grid-template-columns:1fr 1fr;gap:3rem;margin-top:2rem}
.contato-card{border:1px solid var(--border);background:var(--bg2);padding:2rem;position:relative;overflow:hidden;text-decoration:none;display:block;transition:all .3s}
.contato-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),transparent);transition:opacity .3s}
.contato-card:hover{border-color:var(--c2);background:rgba(0,184,184,.04)}
.cc-icon{font-size:28px;margin-bottom:1rem;display:block}
.cc-title{font-family:'Syne Mono',monospace;font-size:12px;color:var(--cyan);letter-spacing:.15em;text-transform:uppercase;margin-bottom:.4rem}
.cc-sub{font-family:'Syne Mono',monospace;font-size:11px;color:var(--gray);margin-bottom:.75rem;line-height:1.6}
.cc-val{font-family:'Syne Mono',monospace;font-size:13px;color:var(--white)}
.contato-card.wa .cc-icon{filter:none}
.contato-card.wa::before{background:linear-gradient(90deg,#25D366,transparent)}
.contato-card.wa:hover{border-color:#25D36660}
.contato-card.wa .cc-title{color:#25D366}
.contato-card.wa .cc-val{color:#25D366}
.contato-card.ig::before{background:linear-gradient(90deg,#E1306C,transparent)}
.contato-card.ig:hover{border-color:#E1306C60}
.contato-card.ig .cc-title{color:#E1306C}
.contato-card.ig .cc-val{color:#E1306C}
.contato-card.em::before{background:linear-gradient(90deg,var(--orange),transparent)}
.contato-card.em .cc-title{color:var(--orange)}
.contato-card.em .cc-val{color:var(--orange)}
.contato-card.si::before{background:linear-gradient(90deg,var(--c2),transparent)}
@media(max-width:768px){.nav-links{display:none}.mg,.pgrid,.chars-grid-new,.contato-grid{grid-template-columns:1fr}.hstats{gap:1.5rem;bottom:1.5rem}.sv{font-size:20px}}

let qIndex=0;const scores={};
function renderQ(){
  const q=questions[qIndex];
  document.getElementById('quiz-prog').textContent=`QUESTION ${qIndex+1} OF ${questions.length} // PRIMAL SIMULATOR`;
  document.getElementById('quiz-q').textContent=q.q;
  const opts=document.getElementById('quiz-opts');
  opts.innerHTML='';
  q.opts.forEach(o=>{
    const b=document.createElement('button');
    b.className='quiz-opt';b.textContent=o.t;
    b.onclick=()=>{
      scores[o.r]=(scores[o.r]||0)+1;
      qIndex++;
      if(qIndex<questions.length)renderQ();
      else showResult();
    };
    opts.appendChild(b);
  });
}

function showResult(){
  const winner=Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];
  document.getElementById('quiz-inner').style.display='none';
  const r=document.getElementById('quiz-result');
  r.style.display='block';
  document.getElementById('res-model').textContent=winner;
  document.getElementById('res-tag').textContent='YOUR V-CHRONOS MODEL';
  document.getElementById('res-desc').textContent=modelDescs[winner]||'Model recommended by the Primal Simulator.';
  addAnomAlert('New user synchronized. Assigned model: '+winner,2);
}

function resetQuiz(){
  qIndex=0;Object.keys(scores).forEach(k=>delete scores[k]);
  document.getElementById('quiz-inner').style.display='block';
document.getElementById('quiz-result').style.display='none';
renderQ();
}

let nos=[];
function initNos(){
  nos=nosData.map(n=>({
    ...n,
    px:n.x*canvas.width,
    py:n.y*canvas.height,
    r:n.type==='anom'?6:n.type==='inactive'?3:4,
    pulse:Math.random()*Math.PI*2,
    speed:0.02+Math.random()*.02,
  }));
  document.getElementById('nos-count').textContent=nos.filter(n=>n.type==='active'||n.type==='anom').length;
}
initNos();

function drawMapa(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle='rgba(13,32,32,0.8)';ctx.lineWidth=1;
  for(let x=0;x<canvas.width;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
  for(let y=0;y<canvas.height;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}

  nos.forEach((a,i)=>{
    if(a.type==='inactive')return;
    nos.slice(i+1).forEach(b=>{
      if(b.type==='inactive')return;
      const dist=Math.hypot(a.px-b.px,a.py-b.py);
      if(dist<180){
        const alpha=(1-dist/180)*.15;
        ctx.beginPath();
        ctx.strokeStyle=`rgba(0,184,184,${alpha})`;
        ctx.lineWidth=.5;
        ctx.moveTo(a.px,a.py);ctx.lineTo(b.px,b.py);ctx.stroke();
      }
    });
  });

  nos.forEach(n=>{
    n.pulse+=n.speed;
    const color=n.type==='anom'?'255,85,0':n.type==='inactive'?'90,106,106':'0,184,184';
    const pr=(Math.sin(n.pulse)+1)/2;

    if(n.type!=='inactive'){
      ctx.beginPath();
      ctx.arc(n.px,n.py,n.r+4+pr*6,0,Math.PI*2);
      ctx.strokeStyle=`rgba(${color},${.15+pr*.1})`;
      ctx.lineWidth=1;ctx.stroke();
    }
    ctx.beginPath();ctx.arc(n.px,n.py,n.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(${color},${n.type==='inactive'?.3:.8+pr*.2})`;
    ctx.fill();

    if(n.name==='Fortaleza'){
      ctx.beginPath();ctx.arc(n.px,n.py,n.r+8+pr*8,0,Math.PI*2);
      ctx.strokeStyle=`rgba(255,85,0,${.3+pr*.2})`;
      ctx.lineWidth=1.5;ctx.stroke();
    }
  });

  requestAnimationFrame(drawMapa);
}
drawMapa();

// Tooltip
canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  let found=null;
  nos.forEach(n=>{if(Math.hypot(n.px-mx,n.py-my)<12)found=n;});
  if(found){
    tooltip.style.opacity='1';
    tooltip.style.left=(e.clientX-rect.left+16)+'px';
    tooltip.style.top=(e.clientY-rect.top-10)+'px';
    const status=found.type==='anom'?'⚠ ANOMALY':found.type==='inactive'?'INACTIVE':'SYNCHRONIZED';
    tooltip.innerHTML=`<span style="color:${found.type==='anom'?'#FF5500':found.type==='inactive'?'#5A6A6A':'#00B8B8'}">${found.name}</span><br>${status}`;
  } else {tooltip.style.opacity='0';}
});

canvas.addEventListener('click',e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  nos.forEach(n=>{
    if(Math.hypot(n.px-mx,n.py-my)<12&&n.type!=='inactive'){
      addAnomAlert(`Node ${n.name} verified — ${n.type==='anom'?'ACTIVE ANOMALY':'synchronized'}.`,n.type==='anom'?3:1);
    }
  });
});
